name: Deploy Skill Service

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, prod]
    steps:
      - name: Deploy Skill Service
        run: |
          set -e
          cd ${{ secrets.DEPLOY_PATH }}/skill_service
          git pull origin main
          docker compose up -d --build
          docker image prune -f
          echo "✅ Skill Service deployed at $(date)"
